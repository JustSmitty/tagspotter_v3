name: iOS

# The maintainer develops on Windows, so nothing here can be verified locally —
# an iOS build needs Xcode, which needs macOS. This workflow is the Mac.
#
# Deliberately NOT on every push: GitHub bills macOS runners at 10x the Linux
# rate, so an always-on iOS job would eat a private repo's whole free tier in a
# few days. Trigger it by hand, or by pushing a v* tag when cutting a release.

on:
  workflow_dispatch:
    inputs:
      signed:
        description: 'Produce a signed .ipa (requires the signing secrets below)'
        type: boolean
        default: false
      upload:
        description: 'Upload to App Store Connect (implies signed)'
        type: boolean
        default: false
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: App
  PROJECT: ios/App/App.xcodeproj

jobs:
  # Always runs, needs no secrets. Catches the things that actually break:
  # a Capacitor plugin that will not compile, a Swift version bump, a missing
  # resource. Code signing is off so no certificate is required.
  compile:
    name: Compile (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # NOT `npm run build:mobile` — that script shells out to PowerShell for
      # asset generation and is Windows-only. The web build plus a sync is what
      # the native project actually consumes.
      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Compile for device, no signing
        run: |
          set -o pipefail
          # Pin DerivedData rather than letting Xcode pick a hashed path under
          # ~/Library. The next step has to find the built .app, and searching
          # for it found nothing on the first real run even though the build
          # succeeded — guessing at Xcode's output location is not worth it when
          # the flag exists.
          #
          # xcpretty is preinstalled on GitHub's macOS images, but fall back to
          # cat rather than re-running the whole build if it ever is not:
          # a second xcodebuild is a slow way to fail on a 10x-billed runner.
          FORMAT=cat
          command -v xcpretty >/dev/null 2>&1 && FORMAT=xcpretty
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | "$FORMAT"

      - name: Confirm the privacy manifest is in the bundle
        run: |
          # A PrivacyInfo.xcprivacy that exists in the repo but was never added to
          # the target ships nothing and still fails review, so assert it landed
          # inside the built .app rather than trusting the pbxproj edit.
          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"

          # The bundle is "Tag Spotter.app", not "App.app": the Xcode TARGET is
          # named App but PRODUCT_NAME is the display name. Match on the
          # extension rather than a guessed filename, and mind the space — every
          # expansion below has to stay quoted.
          APP=$(find "$PRODUCTS" -maxdepth 1 -name '*.app' | head -1)

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::No .app in $PRODUCTS — the build layout changed."
            echo "Contents of $PRODUCTS:"
            ls -la "$PRODUCTS" 2>/dev/null || echo "  (missing)"
            exit 1
          fi

          echo "built app: $APP"
          if [ -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "PrivacyInfo.xcprivacy present in the bundle"
            plutil -p "$APP/PrivacyInfo.xcprivacy"
          else
            echo "::error::PrivacyInfo.xcprivacy missing from the built bundle — check the App target's Copy Bundle Resources phase"
            echo "Bundle contents:"
            ls -la "$APP"
            exit 1
          fi

  # Signed archive. Skipped unless the run was dispatched with signed=true (or a
  # v* tag was pushed) AND the signing secrets exist.
  archive:
    name: Signed archive
    runs-on: macos-latest
    needs: compile
    if: >-
      github.event_name == 'push' ||
      inputs.signed == true ||
      inputs.upload == true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the signing secrets are present
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          missing=0
          for name in CERT PROFILE TEAM; do
            if [ -z "${!name}" ]; then echo "::error::missing secret for $name"; missing=1; fi
          done
          [ "$missing" = 0 ] || {
            echo "::error::See docs/app-store-release.md for how to create these."
            exit 1
          }

      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      # Signing material is loaded into a throwaway keychain that exists only for
      # this runner, and the runner is destroyed afterwards. Nothing is written
      # into the repo.
      - name: Install certificate and provisioning profile
        env:
          CERT_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo "$CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          # The archive step signs manually, so it needs the profile's NAME for
          # PROVISIONING_PROFILE_SPECIFIER, and Xcode needs the file on disk named
          # by its UUID. Both are read out of the profile itself — hardcoding
          # either one breaks the first time the profile is regenerated.
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")
          PROFILE_APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")
          echo "profile: $PROFILE_NAME ($PROFILE_UUID) for $PROFILE_APPID"

          # Fail here, with a sentence, rather than in codesign with an opaque one.
          case "$PROFILE_APPID" in
            *.com.tagspotter.app) ;;
            *)
              echo "::error::Provisioning profile is for $PROFILE_APPID, not com.tagspotter.app"
              exit 1
              ;;
          esac

          # Xcode 16 moved where it reads provisioning profiles from. Write both
          # paths: the old one is inert on a new Xcode, and the new one is the
          # only place a current runner image looks.
          for DIR in ~/Library/MobileDevice/Provisioning\ Profiles \
                     ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles; do
            mkdir -p "$DIR"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$DIR/$PROFILE_UUID.mobileprovision"
          done

          # Consumed by the archive and export steps below.
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

          rm -f "$RUNNER_TEMP/cert.p12" "$PROFILE_PLIST"

      - name: Archive
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -o pipefail
          # Sign explicitly, overriding the project's CODE_SIGN_STYLE = Automatic.
          # Automatic signing asks the developer portal to create and manage the
          # profile, and there is nobody on a CI runner to authenticate that
          # request — the archive fails before it compiles a single file.
          # -allowProvisioningUpdates is the same trap wearing a helpful name: it
          # only does anything when Xcode can already talk to the portal. The
          # profile is installed on disk by the previous step, so name it and go.
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            DEVELOPMENT_TEAM="$TEAM_ID"

      - name: Export .ipa
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <!-- Must match the archive. Left unset, exportArchive falls back to
                 automatic signing and hits the same unauthenticated portal call
                 the archive step was changed to avoid. -->
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tagspotter.app</key><string>${PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload .ipa as a build artifact
        uses: actions/upload-artifact@v7
        with:
          name: tagspotter-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14

      # Publishing to App Store Connect is a separate, explicitly opted-in step.
      # A tag push alone will not send a build to Apple.
      - name: Upload to App Store Connect
        if: inputs.upload == true
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
          rm -rf ~/private_keys
