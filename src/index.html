<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Tag Spotter</title>

  <base href="/" />
  <!-- Fonts are self-hosted (src/theme/fonts.scss) so the vintage typography
       survives offline starts; the CSP therefore has no font hosts. The atlas is
       inline SVG projected from bundled GeoJSON, so there are no tile hosts and
       no script host either. The runtime-string-evaluation allowance that
       MapLibre's expression engine required went out with MapLibre itself —
       nothing left in the bundle evaluates code at runtime. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; connect-src 'self' capacitor://localhost http://localhost https://localhost; font-src 'self' data:; frame-src 'none'; img-src 'self' data: blob: capacitor://localhost http://localhost https://localhost; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; worker-src blob:; child-src blob:;"
    />

  <meta name="color-scheme" content="light" />
  <!-- Pinch zoom is deliberately left enabled: locking the scale is a WCAG 1.4.4
       failure, and Ionic handles input-focus zoom without needing a lock. -->
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body class="paper-texture">
  <app-root></app-root>
</body>

</html>
