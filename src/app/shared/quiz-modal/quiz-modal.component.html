<ion-header class="ion-no-border digital-ephemera-header quiz-header">
  <ion-toolbar class="premium-toolbar cardstock-layer">
    <div class="toolbar-inner">
      <div class="toolbar-copy">
        <span class="toolbar-kicker">Roadside Trivia</span>
        <span class="toolbar-meta">Question {{ questionOrdinal }} of {{ questionCount }}</span>
      </div>

      <ion-button
        fill="clear"
        class="close-button"
        (click)="onClose()"
        aria-label="Close trivia">
        <ion-icon slot="icon-only" name="close-circle"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="paper-texture quiz-content">
  <div class="quiz-stage">
    <section class="quiz-pass stamped-effect cardstock-layer paper-flip-enter" [attr.data-region]="stateRegion">
      <div class="pass-topline">
        <div class="route-copy">
          <span class="route-code">{{ stateCode }}</span>
          <span class="route-name">{{ stateName }}</span>
        </div>

        <div class="passport-stamp" *ngIf="imageSrc && question.topic !== 'Flag'">
          <img [src]="imageSrc" [alt]="stateName + ' flag'" loading="lazy" />
        </div>
      </div>

      <div class="pass-banner">
        <span class="banner-topic">{{ question.topic }}</span>
        <span class="banner-copy">Official Trivia Pass</span>
      </div>

      <div class="question-panel">
        <span class="question-kicker">Punch {{ questionOrdinal }}</span>
        <p class="question-text">{{ question.prompt }}</p>
      </div>

      <div class="options-grid" [class.image-grid]="question.optionType === 'image'">
        <button
          *ngFor="let option of question.options; let index = index"
          class="quiz-option stamped-effect"
          [class.image-option]="question.optionType === 'image'"
          type="button"
          (click)="onSelect(option)">
          <span class="option-marker" *ngIf="question.optionType !== 'image'">{{ answerMarkers[index] }}</span>
          <span class="option-label" *ngIf="question.optionType !== 'image'">{{ option }}</span>
          <img class="option-image" *ngIf="question.optionType === 'image'" [src]="option" alt="Flag option" loading="lazy" />
          <span class="indicator" aria-hidden="true" *ngIf="question.optionType !== 'image'"></span>
        </button>
      </div>

      <div class="ticket-footer">
        <div class="progress-dots">
          <div
            *ngFor="let i of progressDots"
            class="dot"
            [class.active]="i < questionIndex"
            [class.current]="i === questionIndex">
          </div>
        </div>

        <div class="footer-seal">Valid For Bonus Points</div>
      </div>
    </section>
  </div>
</ion-content>
