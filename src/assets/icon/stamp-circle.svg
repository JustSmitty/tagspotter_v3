<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Distressed outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="2,1,3,2" opacity="0.8" transform="rotate(-5, 50, 50)" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="1,2" opacity="0.6" />
  
  <!-- "SPOTTED" text arched or centered -->
  <text x="50" y="55" font-family="Courier New, Courier, monospace" font-size="14" font-weight="900" fill="#c0392b" text-anchor="middle" letter-spacing="1" opacity="0.9" transform="rotate(-15, 50, 55)">
    SPOTTED
  </text>
  
  <!-- Subtle "ink splatter" dots -->
  <circle cx="30" cy="30" r="1" fill="#c0392b" opacity="0.4" />
  <circle cx="70" cy="70" r="0.8" fill="#c0392b" opacity="0.3" />
  <circle cx="45" cy="25" r="1.2" fill="#c0392b" opacity="0.5" />
</svg>
